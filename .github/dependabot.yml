version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 1

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/mcp-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # @types/vscode must stay in lockstep with engines.vscode in package.json,
      # or `vsce package` fails at release time. Bump both together manually.
      - dependency-name: "@types/vscode"
